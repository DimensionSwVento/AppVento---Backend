# mutmut configuration for the RQ2 mutation-testing run on domain/.
# Copied to the root of a disposable worktree at run time (see
# workspace/evidence/mutation/DESIGN.md in the paper workspace); not part of
# the product configuration.
[mutmut]
source_paths=
    domain/
pytest_add_cli_args_test_selection=
    tests/unit
# The unit suite imports the rest of the application in a few modules;
# copy them so collection works inside mutants/.
also_copy=
    shared/
    application/
    infrastructure/
    api/
    main.py
pytest_add_cli_args=
    -x
    -q
    --no-header
# Killed mutants fail fast with -x; survivors pay the full unit suite (~31 s).
# A hung mutant is stopped at (31 + 2) * 2 ≈ 66 s instead of the 8-minute default.
timeout_multiplier=2.0
timeout_constant=2.0
