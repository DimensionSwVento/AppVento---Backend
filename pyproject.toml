[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers --tb=short"
markers = [
    "postgres: tests de integración que requieren un PostgreSQL real (docker compose up -d db)",
    # Atributo de calidad (catálogo compartido quality/quality-attributes.json). Cada test
    # lleva EXACTAMENTE uno (lo verifica tests/conftest.py). Ver docs/testing/quality-attributes-pipeline.md.
    "qa_processing: quality attribute processing (Processing)",
    "qa_availability: quality attribute availability (Availability)",
    "qa_data_integration: quality attribute data-integration (Data Integration)",
    "qa_performance: quality attribute performance (Performance)",
    "qa_result_quality: quality attribute result-quality (Result Quality)",
    "qa_security: quality attribute security (Security)",
    "qa_data_quality: quality attribute data-quality (Data Quality)",
    "qa_scalability: quality attribute scalability (Scalability)",
    "qa_interoperability: quality attribute interoperability (Interoperability)",
    "qa_usability_geospatial: quality attribute usability-geospatial (Usability (Geospatial))",
    "qa_traceability_auditability: quality attribute traceability-auditability (Traceability and Auditability)",
    "qa_resilience: quality attribute resilience (Resilience)",
    "qa_geoethics: quality attribute geoethics (Geoethics)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Reglas por defecto (errores reales: sintaxis, nombres no definidos, imports
# sin usar). E701 (one-liner `if x: return y`) es estilo intencional del código
# existente y se ignora para no refactorizar lógica de aplicación.
select = ["E4", "E7", "E9", "F"]
ignore = ["E701"]

[tool.coverage.run]
source = ["domain", "application", "infrastructure", "api", "shared"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Política ratchet: ~5 puntos por debajo de la medición vigente. No bajar nunca
# para "arreglar" CI — agrega tests o justifica un `exclude`.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
