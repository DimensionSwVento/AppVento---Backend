services:
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    volumes:
      - ${PARQUET_DATA_PATH:-../Vento/src/app/Utils}:/data:ro
    environment:
      - PARQUET_PATH=/data/master_variables.h3.parquet
      - CORS_ORIGINS=http://localhost:3000
      - ENV=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
