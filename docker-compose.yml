# Vento — Backend + Postgres para despliegue con Docker.
#
#   docker compose up -d --build           # levanta db + app (migra al arrancar)
#   docker compose run --rm app python -m tools.ingest_parquet   # ingesta manual
#   docker compose run --rm app python -m tools.inspect_parquet  # ver estructura
#
# Coloca el parquet en ./data/master_variables.h3.parquet (se monta como volumen).
# Keycloak es externo y obligatorio: apunta KEYCLOAK_ISSUER en .env.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vento
      POSTGRES_PASSWORD: vento
      POSTGRES_DB: vento
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Expuesto al host para los tests de integración locales (pytest --cov).
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vento -d vento"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Sobrescriben lo que venga del .env para que apunten al contenedor `db`.
      DATABASE_URL: postgresql+psycopg://vento:vento@db:5432/vento
      PARQUET_PATH: /app/data/master_variables.h3.parquet
      # RUN_INGEST: "true"   # descomenta para ingerir el parquet al arrancar
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
